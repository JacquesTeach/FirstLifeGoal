<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smallpox Quiz (20 Questions)</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f4f7fb;
}
h1{
    text-align:center;
    color:#1f4e79;
}
#timer{
    font-size:20px;
    font-weight:bold;
    color:#b22222;
    text-align:center;
    margin-bottom:15px;
}
.progress-container{
    width:100%;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}
.progress-bar{
    height:24px;
    width:0%;
    background:#28a745;
    text-align:center;
    color:white;
    line-height:24px;
    font-weight:bold;
}
.question{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}
.question h3{
    margin-top:0;
}
.option{
    margin:8px 0;
}
.correct{
    background:#d4edda;
}
.incorrect{
    background:#f8d7da;
}
button{
    padding:12px 25px;
    font-size:16px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#163857;
}
#results{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
}
.feedback{
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Smallpox: Advanced Reading Quiz</h1><BR>
<a href="Smallpox Reading Passage.html">Read the passage. Complete the quiz.</a><BR>    

<div id="timer">Time: 30:00</div>

<div class="progress-container">
    <div id="progressBar" class="progress-bar">0%</div>
</div>

<form id="quizForm"></form>

<div style="text-align:center;margin-top:20px;">
    <button type="button" onclick="gradeQuiz()">Submit Quiz</button>
</div>

<div id="results"></div>

<script>

const questions = [

{
q:"Which statement best expresses the main idea of the passage?",
options:[
"Smallpox was eradicated through a combination of scientific innovation and international public-health efforts.",
"Smallpox disappeared naturally because living conditions improved worldwide.",
"The history of smallpox is mainly a history of European medicine.",
"Modern vaccination programs are less important than traditional remedies."
],
answer:0
},

{
q:"Why does the author discuss variolation before describing Jenner's work?",
options:[
"To show that attempts to prevent smallpox existed before vaccination.",
"To argue that variolation was safer than vaccination.",
"To demonstrate that variolation completely eradicated the disease.",
"To prove that physicians rejected preventive methods."
],
answer:0
},

{
q:"What can be inferred about smallpox before the development of effective prevention methods?",
options:[
"It posed a serious threat to large populations.",
"It affected only isolated communities.",
"It was usually a mild childhood illness.",
"It spread more slowly than most diseases."
],
answer:0
},

{
q:"Which detail most strongly supports the claim that vaccination represented a major improvement over earlier methods?",
options:[
"It reduced reliance on deliberately infecting people with smallpox material.",
"It was introduced after the twentieth century.",
"It required no scientific observation.",
"It eliminated the need for public-health systems."
],
answer:0
},

{
q:"The passage suggests that Jenner's success was primarily based on:",
options:[
"careful observation and experimentation.",
"advanced laboratory technology.",
"financial support from governments.",
"traditional folk beliefs."
],
answer:0
},

{
q:"Which sentence is the best paraphrase of a likely topic sentence about WHO's campaign?",
options:[
"Global cooperation played a crucial role in eliminating smallpox.",
"Smallpox remained common because governments ignored it.",
"Medical discoveries are rarely useful without hospitals.",
"International organizations usually focus on local problems."
],
answer:0
},

{
q:"What is the author's most likely purpose for mentioning the World Health Organization?",
options:[
"To illustrate how coordinated international action contributed to eradication.",
"To criticize global health agencies.",
"To compare WHO with nineteenth-century doctors.",
"To explain how viruses evolve."
],
answer:0
},

{
q:"Which inference is most reasonable based on the campaign against smallpox?",
options:[
"Eradication required more than a scientific discovery alone.",
"Scientific knowledge was unnecessary once vaccines existed.",
"Only wealthy nations participated in disease control.",
"Vaccination programs succeeded without monitoring outbreaks."
],
answer:0
},

{
q:"Choose the answer that correctly completes the relative-clause sentence: 'Jenner developed a vaccine ______ changed medical history.'",
options:[
"that",
"whom",
"whose",
"where"
],
answer:0
},

{
q:"Choose the answer that correctly completes the relative-clause sentence: 'Smallpox, ______ killed millions, was eventually eradicated.'",
options:[
"which",
"whose",
"where",
"whom"
],
answer:0
},

{
q:"What does the passage imply about the relationship between science and public policy?",
options:[
"Both were necessary for successful eradication.",
"Science prevented governments from taking action.",
"Public policy replaced scientific research.",
"The two were largely unrelated."
],
answer:0
},

{
q:"Which detail would best support the author's argument that smallpox could be eradicated?",
options:[
"The disease had characteristics that made worldwide vaccination effective.",
"Most viruses disappear without intervention.",
"Doctors stopped studying infectious diseases.",
"The disease was confined to one city."
],
answer:0
},

{
q:"In context, the word 'eradicated' most nearly means:",
options:[
"completely eliminated",
"temporarily reduced",
"carefully examined",
"unexpectedly discovered"
],
answer:0
},

{
q:"Why might the author describe smallpox as unique among human diseases?",
options:[
"Because it became the first disease eradicated worldwide.",
"Because it was never contagious.",
"Because it affected animals but not humans.",
"Because it existed only in recent history."
],
answer:0
},

{
q:"Which conclusion is best supported by the passage?",
options:[
"Public-health achievements often depend on sustained international cooperation.",
"Medical breakthroughs always produce immediate results.",
"Historical diseases have little relevance today.",
"Vaccines are effective only in developed countries."
],
answer:0
},

{
q:"What is the function of the historical examples in the passage?",
options:[
"To show the progression from early prevention methods to eradication.",
"To entertain readers with unusual stories.",
"To compare unrelated diseases.",
"To minimize the importance of vaccination."
],
answer:0
},

{
q:"Which statement would the author most likely agree with?",
options:[
"Scientific discoveries are most effective when widely implemented.",
"Local traditions should replace modern medicine.",
"Eradication efforts are generally impossible.",
"Diseases disappear without organized intervention."
],
answer:0
},

{
q:"Choose the best paraphrase: 'Smallpox eradication was not the result of a single event.'",
options:[
"The elimination of smallpox occurred through multiple developments and coordinated efforts.",
"One discovery alone immediately ended smallpox worldwide.",
"Smallpox vanished unexpectedly without explanation.",
"Researchers never understood how smallpox spread."
],
answer:0
},

{
q:"Based on the passage, why was surveillance important during eradication campaigns?",
options:[
"It helped identify and contain remaining outbreaks.",
"It replaced vaccination as the primary strategy.",
"It prevented scientists from collecting data.",
"It focused only on historical cases."
],
answer:0
},

{
q:"What broader lesson can readers draw from the history of smallpox?",
options:[
"Global problems can sometimes be solved through evidence-based cooperation.",
"Scientific knowledge has limited practical value.",
"International health efforts generally fail.",
"Prevention is less effective than treatment."
],
answer:0
}

];

function shuffleAnswers(question){
    let opts = question.options.map((x,i)=>({text:x,isCorrect:i===question.answer}));
    for(let i=opts.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [opts[i],opts[j]]=[opts[j],opts[i]];
    }
    question.shuffled=opts;
}

questions.forEach(shuffleAnswers);

const quizForm=document.getElementById("quizForm");

questions.forEach((q,index)=>{
    const div=document.createElement("div");
    div.className="question";

    let html=`<h3>${index+1}. ${q.q}</h3>`;

    q.shuffled.forEach((opt,i)=>{
        const letter=["A","B","C","D"][i];
        html+=`
        <div class="option">
            <label>
                <input type="radio" name="q${index}" value="${i}" onchange="updateProgress()">
                <strong>${letter}.</strong> ${opt.text}
            </label>
        </div>`;
    });

    html+=`<div class="feedback" id="fb${index}"></div>`;
    div.innerHTML=html;
    quizForm.appendChild(div);
});

function updateProgress(){
    let answered=0;

    questions.forEach((q,idx)=>{
        if(document.querySelector(`input[name="q${idx}"]:checked`)){
            answered++;
        }
    });

    let percent=Math.round((answered/questions.length)*100);

    let bar=document.getElementById("progressBar");
    bar.style.width=percent+"%";
    bar.textContent=percent+"%";
}

function gradeQuiz(){

    let score=0;

    questions.forEach((q,idx)=>{

        const selected=document.querySelector(`input[name="q${idx}"]:checked`);
        const feedback=document.getElementById(`fb${idx}`);

        let correctIndex=q.shuffled.findIndex(x=>x.isCorrect);

        if(selected){

            if(parseInt(selected.value)===correctIndex){
                score++;
                feedback.textContent="✓ Correct";
                feedback.style.color="green";
                selected.closest(".option").classList.add("correct");
            }else{
                feedback.textContent="✗ Incorrect";
                feedback.style.color="red";
                selected.closest(".option").classList.add("incorrect");

                const radios=document.getElementsByName(`q${idx}`);
                radios[correctIndex].closest(".option").classList.add("correct");
            }

        }else{
            feedback.textContent="No answer selected";
            feedback.style.color="orange";

            const radios=document.getElementsByName(`q${idx}`);
            radios[correctIndex].closest(".option").classList.add("correct");
        }

    });

    let percent=((score/questions.length)*100).toFixed(1);

    document.getElementById("results").innerHTML=
        `Score: ${score} / ${questions.length}<br>
         Percentage: ${percent}%`;

    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

let timeLeft=1800;

const timer=setInterval(()=>{

    let minutes=Math.floor(timeLeft/60);
    let seconds=timeLeft%60;

    document.getElementById("timer").innerHTML=
        `Time: ${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

    timeLeft--;

    if(timeLeft<0){
        clearInterval(timer);
        alert("Time is up! Your quiz will be submitted automatically.");
        gradeQuiz();
    }

},1000);

</script>

</body>
</html>
