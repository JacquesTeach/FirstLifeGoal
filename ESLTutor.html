<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive AI ESL Tutor</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --user-msg: #4f46e5;
            --ai-msg: #f9fafb;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            height: 85vh;
            overflow: hidden;
        }

        header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: #ffffff;
        }

        .title-group h1 {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .title-group p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .api-group {
            display: flex;
            gap: 0.5rem;
        }

        input[type="password"], input[type="text"] {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .quick-prompts {
            padding: 0.75rem 1.25rem;
            background: #f9fafb;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .chip {
            background: #eef2ff;
            color: var(--primary);
            border: 1px solid #c7d2fe;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chip:hover {
            background: #e0e7ff;
        }

        #chat-box {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background: var(--ai-msg);
            color: var(--text);
            align-self: flex-start;
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .message.system-notice {
            align-self: center;
            background: #fef3c7;
            color: #92400e;
            font-size: 0.85rem;
            max-width: 90%;
            text-align: center;
        }

        .input-area {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.75rem;
            background: #ffffff;
        }

        #user-input {
            flex: 1;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-group">
            <h1>Interactive ESL Tutor</h1>
            <p>Practice grammar, vocabulary, and conversation</p>
        </div>
        <div class="api-group">
            <input type="password" id="api-key" placeholder="Paste OpenAI API Key (sk-...)" />
        </div>
    </header>

    <div class="quick-prompts">
        <button class="chip" onclick="usePrompt('I need help with the present perfect.')">Present Perfect</button>
        <button class="chip" onclick="usePrompt('Give me a fill-in-the-blank quiz on prepositions (in, on, at).')">Prepositions Quiz</button>
        <button class="chip" onclick="usePrompt('Let\'s roleplay ordering food at a restaurant.')">Restaurant Roleplay</button>
        <button class="chip" onclick="usePrompt('Help me practice confusing words like affect vs effect.')">Affect vs. Effect</button>
    </div>

    <div id="chat-box">
        <div class="message ai">Hello! I am your personal ESL Tutor. Tell me what you would like to practice today (e.g., "I need help with the present perfect"), and I will create an interactive activity for you!</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message or answer here..." onkeypress="handleKeyPress(event)" />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const SYSTEM_PROMPT = `You are a patient, encouraging, and expert ESL (English as a Second Language) tutor. 
When a student asks for help with a grammar topic, vocabulary, or skill:
1. Briefly explain the rule in simple, clear terms with 1-2 examples.
2. Immediately provide a short, interactive practice activity (such as 3-5 fill-in-the-blank sentences, a sentence correction task, or a short prompt for them to answer).
3. Wait for the student to submit their answers before revealing the solutions.
4. When they reply, grade their work gently, explain *why* any mistakes happened, and ask if they want another round or a new topic.`;

    let conversationHistory = [
        { role: "system", content: SYSTEM_PROMPT }
    ];

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key');

    if (sessionStorage.getItem('openai_api_key')) {
        apiKeyInput.value = sessionStorage.getItem('openai_api_key');
    }

    apiKeyInput.addEventListener('change', () => {
        sessionStorage.setItem('openai_api_key', apiKeyInput.value.trim());
    });

    function usePrompt(text) {
        userInput.value = text;
        sendMessage();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    async function sendMessage() {
        const apiKey = apiKeyInput.value.trim();
        const text = userInput.value.trim();

        if (!apiKey) {
            appendMessage("⚠️ Please enter your OpenAI API key in the top-right box first.", "system-notice");
            return;
        }

        if (!text) return;

        appendMessage(text, "user");
        conversationHistory.push({ role: "user", content: text });
        userInput.value = '';
        
        userInput.disabled = true;
        sendBtn.disabled = true;
        const loadingMsg = appendMessage("Thinking...", "ai");

        try {
            const response = await fetch("https://jacques-interlink.workers.dev", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: conversationHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "Failed to connect to OpenAI.");
            }

            const aiReply = data.choices[0].message.content;
            loadingMsg.textContent = aiReply;
            conversationHistory.push({ role: "assistant", content: aiReply });

        } catch (error) {
            loadingMsg.remove();
            appendMessage(`Error: ${error.message}`, "system-notice");
            conversationHistory.pop();
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }
</script>

</body>
</html>
