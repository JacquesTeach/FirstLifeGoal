<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organ Transplants Quiz</title><style>body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px}.container{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:12px}h1{text-align:center}#timer{text-align:right;font-weight:bold;color:#c0392b}#progress{width:100%;background:#ddd;border-radius:20px;overflow:hidden;margin:10px 0}#bar{height:20px;width:0;background:#27ae60}.question{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0}label{display:block;padding:4px}.correct{background:#d4edda}.incorrect{background:#f8d7da}button{padding:10px 16px;margin:5px;border:none;border-radius:6px;background:#3498db;color:white}#result{text-align:center;font-size:22px;font-weight:bold;margin-top:20px}@media(max-width:600px){body{padding:10px}}</style></head><body><div class="container"><h1>Organ Transplants Quiz</h1>
<!-- Embedded audio object -->
<audio id="audioObj" controls>
    <source src="OrganTransplantation.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
<div id="timer">Time: 15:00</div><div id="progress"><div id="bar"></div></div><form id="quiz"></form><button onclick="gradeQuiz();return false;">Submit Quiz</button><button onclick="location.reload();return false;">Retry</button><div id="result"></div></div><script>const qs=[['What is an organ transplant?',['Transfer of a healthy organ to a patient','A fitness program','A blood test','A vaccine'],'Transfer of a healthy organ to a patient'],['Organ transplants help people with:',['Organ failure','Broken bones','Financial problems','Age-related issues'],'Organ failure'],['Which organ can be transplanted?',['Kidney','Stone','Bone only','Hair'],'Kidney'],['Organ transplantation is considered an achievement of:',['Modern medicine','Ancient farming','Architecture','Transportation'],'Modern medicine'],['Experimental procedures began in the:',['Early twentieth century','Middle Ages','1700s','1800s'],'Early twentieth century'],['The first successful kidney transplant occurred in:',['1954','1900','2000','1985'],'1954'],['The first successful kidney transplant involved:',['Identical twins','Older patients','Animal-to-human','Athletes'],'Identical twins'],['What improved transplant success rates?',['Anti-rejection drugs','More hospitals','Telemedicine','Bigger hospitals'],'Anti-rejection drugs'],['Which transplant became common later?',['Heart transplant','Gene transplant','Bone transplant','Animal transplant'],'Heart transplant'],['Thousands of transplants are performed each year:',['Around the world','In Europe','In developing countries','With infants'],'Around the world'],['A living donor is:',['A person who donates while alive','A robot','A hospital','A patient only'],'A person who donates while alive'],['Organs may also come from:',['Deceased donors','Companies','Museums','Organ repair shops'],'Deceased donors'],['One challenge is:',['Shortage of donated organs','Too many organs','Too many hospitals','Too much exercise'],'Shortage of donated organs'],['Organ shortages create:',['Long waiting lists','More vacations','Lower expectations','Economic problems'],'Long waiting lists'],['An ethical issue concerns:',['Organ allocation','Sports teams','Movie ratings','Cooking'],'Organ allocation'],['Another concern involves:',['Donor Consent','Donor Preference','Donor Age','Donor Quality'],'Donor consent'],['Fairness in organ distribution is:',['An ethical concern','A legal concern','A practical concern','A family concern'],'An ethical concern'],['What illegal activity is mentioned?',['Trade of human organs','Advertising Organs','Organ repair','Online sales'],'Trade of human organs'],['The consensus is that organ transplantation is:',['Life-saving and valuable','Difficult','Risky','Required'],'Life-saving and valuable'],['Organ transplants offer patients:',['Hope and better health outcomes','Free benefits','Popularity','New careers'],'Hope and better health outcomes']];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}const form=document.getElementById('quiz');qs.forEach((q,n)=>{let opts=q[1].map(x=>({t:x,c:x===q[2]}));shuffle(opts);let d=document.createElement('div');d.className='question';let h='<p><b>'+(n+1)+'. '+q[0]+'</b></p>';opts.forEach((o,i)=>{let L=['A','B','C','D'][i];h+=`<label><input type="radio" name="q${n}" value="${o.c}"> ${L}. ${o.t}</label>`});d.innerHTML=h;form.appendChild(d);});form.addEventListener('change',()=>{let a=document.querySelectorAll('input:checked').length;document.getElementById('bar').style.width=(a/qs.length*100)+'%';});let time=900;const timer=setInterval(()=>{let m=Math.floor(time/60),s=time%60;document.getElementById('timer').textContent='Time: '+m+':'+String(s).padStart(2,'0');time--;if(time<0){clearInterval(timer);gradeQuiz();}},1000);function gradeQuiz(){clearInterval(timer);let score=0;qs.forEach((q,n)=>{let s=document.querySelector(`input[name=q${n}]:checked`);if(s){if(s.value==='true'){score++;s.parentElement.classList.add('correct');}else{s.parentElement.classList.add('incorrect');document.querySelectorAll(`input[name=q${n}]`).forEach(x=>{if(x.value==='true')x.parentElement.classList.add('correct');});}}});document.getElementById('result').innerHTML='Score: '+score+'/20 ('+Math.round(score*100/20)+'%)';}</script></body></html>
