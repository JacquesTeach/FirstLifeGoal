<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biostatistics Quiz</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    max-width:1100px;
    margin:auto;
    padding:20px;
    background:#f4f7fb;
    line-height:1.6;
}
h1{
    text-align:center;
    color:#1f4e79;
}
.instructions{
    background:#eaf2ff;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}
.question{
    background:white;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.question h3{
    margin-top:0;
    color:#003366;
}
.options label{
    display:block;
    padding:4px;
}
button{
    background:#1f4e79;
    color:white;
    border:none;
    padding:15px 25px;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#163a5a;
}
#results{
    margin-top:25px;
    padding:20px;
    background:#fff;
    border-radius:10px;
    display:none;
}
.correct{
    color:green;
    font-weight:bold;
}
.incorrect{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Biostatistics Quiz - Chapter 4</h1>

<div class="instructions">
<p><strong>Instructions:</strong></p>
<ul>
<li>Use a calculator.</li>
<li>Select the best answer for each question.</li>
<li>Click <strong>Submit Quiz</strong> when finished.</li>
<li>Your score and percentage will be calculated automatically.</li>
</ul>
</div>

<form id="quizForm">

<div id="quizContainer"></div>

<br>
<button type="button" onclick="gradeQuiz()">Submit Quiz</button>

</form>

<div id="results"></div>

<script>

const questions = [

{
q:"1. A random variable X has probabilities 0.10, 0.30, 0.40, and 0.20 for x = 2,4,6,8. What is P(X ≥ 4)?",
options:["0.6000","0.7000","0.9000","1.0000"],
answer:"C"
},

{
q:"2. Distribution: x = 1,2,3,4 with probabilities 0.15,0.25,0.35,0.25. Find E(X).",
options:["2.70","2.55","2.80","3.10"],
answer:"A"
},

{
q:"3. Using Question 2's distribution, find E(X²).",
options:["7.30","7.70","8.10","8.50"],
answer:"B"
},

{
q:"4. Using Question 2's distribution, find Var(X).",
options:["0.9475","1.1975","1.4475","1.8975"],
answer:"A"
},

{
q:"5. Distribution: x=0,1,2,3 with probabilities 0.20,0.30,0.40,0.10. Find P(X>1).",
options:["0.40","0.50","0.60","0.70"],
answer:"B"
},

{
q:"6. 30% of patients miss appointments. If 8 patients are selected, find P(X=2).",
options:["0.2965","0.2541","0.1977","0.1402"],
answer:"A"
},

{
q:"7. X ~ Bin(10,0.4). Find P(X=4).",
options:["0.2508","0.1115","0.2007","0.3288"],
answer:"A"
},

{
q:"8. X ~ Bin(12,0.25). Find the mean.",
options:["2","2.5","3","4"],
answer:"C"
},

{
q:"9. X ~ Bin(12,0.25). Find the variance.",
options:["2.25","3.00","2.50","1.75"],
answer:"A"
},

{
q:"10. X ~ Bin(8,0.6). Find P(X≤1).",
options:["0.0087","0.0498","0.0912","0.1735"],
answer:"A"
},

{
q:"11. Hypertension probability = 0.24. Sample size = 5. Find P(X=0).",
options:["0.2536","0.1942","0.3248","0.4037"],
answer:"A"
},

{
q:"12. Coin with P(H)=0.55 tossed 6 times. Find P(X≥5).",
options:["0.0617","0.1209","0.0781","0.0984"],
answer:"B"
},

{
q:"13. Poisson distribution with λ=4. Find P(X=3).",
options:["0.1954","0.1465","0.2240","0.0892"],
answer:"A"
},

{
q:"14. X ~ Poisson(5). Find P(X=0).",
options:["0.0067","0.0250","0.0337","0.0821"],
answer:"A"
},

{
q:"15. X ~ Poisson(3). Find P(X≥1).",
options:["0.7769","0.9502","0.9643","0.8734"],
answer:"B"
},

{
q:"16. Average emergency cases = 2 per hour. Find expected number in 6 hours.",
options:["8","10","12","14"],
answer:"C"
},

{
q:"17. X ~ Poisson(7). Find variance.",
options:["5","6","7","49"],
answer:"C"
},

{
q:"18. Average laboratory accidents = 0.5 per month. Find P(X=1).",
options:["0.1516","0.3033","0.6065","0.0758"],
answer:"B"
},

{
q:"19. X ~ N(100,16). Find P(X<104).",
options:["0.5000","0.6827","0.8413","0.9772"],
answer:"C"
},

{
q:"20. Normal distribution mean=70, sd=10. Find P(X>80).",
options:["0.1587","0.3413","0.5000","0.8413"],
answer:"A"
},

{
q:"21. Mean=80, sd=12. Find z-score for x=98.",
options:["1.25","1.50","1.75","2.00"],
answer:"B"
},

{
q:"22. X ~ N(50,25). Find P(X<55).",
options:["0.6827","0.5000","0.8413","0.9332"],
answer:"C"
},

{
q:"23. Mean=20, sd=4. Find P(X<24).",
options:["0.5000","0.8413","0.9772","0.6915"],
answer:"B"
},

{
q:"24. IQ scores: mean=100, sd=15. What score corresponds to z=1.96?",
options:["119.4","129.4","114.7","125.6"],
answer:"B"
},

{
q:"25. Exam scores: mean=75, sd=8. What score cuts off the lowest 16%?",
options:["59","67","75","83"],
answer:"B"
}

];

const letters=["A","B","C","D"];
const container=document.getElementById("quizContainer");

questions.forEach((item,index)=>{

let html=`
<div class="question">
<h3>${item.q}</h3>
<div class="options">
`;

item.options.forEach((opt,i)=>{
html += `
<label>
<input type="radio" name="q${index}" value="${letters[i]}">
${letters[i]}. ${opt}
</label>
`;
});

html += `
</div>
</div>
`;

container.innerHTML += html;

});

function gradeQuiz(){

let score=0;
let answered=0;

questions.forEach((q,index)=>{

const selected=document.querySelector(`input[name="q${index}"]:checked`);

if(selected){
answered++;
if(selected.value===q.answer){
score++;
}
}

});

const percent=((score/questions.length)*100).toFixed(1);

let resultColor="red";
if(percent>=60){
resultColor="green";
}

document.getElementById("results").style.display="block";

document.getElementById("results").innerHTML=`
<h2>Quiz Results</h2>

<p><strong>Questions Answered:</strong> ${answered} / ${questions.length}</p>

<p><strong>Score:</strong> ${score} / ${questions.length}</p>

<p><strong>Percentage:</strong>
<span style="color:${resultColor};font-weight:bold;font-size:22px;">
${percent}%
</span>
</p>

<p>
<strong>Status:</strong>
<span style="color:${resultColor};font-weight:bold;">
${percent>=60 ? "PASS" : "FAIL"}
</span>
</p>
`;

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

</script>

</body>
</html>
