<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col h-screen max-w-2xl mx-auto p-4">

    <!-- Header -->
    <header class="bg-white border border-slate-200 rounded-t-2xl p-4 shadow-sm flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-lg">AI</div>
            <div>
                <h1 class="font-semibold text-slate-900">English Practice Tutor</h1>
                <p class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online & Ready
                </p>
            </div>
        </div>
        <button onclick="clearChat()" class="text-xs text-slate-500 hover:text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg transition">Clear Chat</button>
    </header>

    <!-- Chat Messages Box -->
    <div id="chat-container" class="chat-container flex-1 bg-white border-x border-slate-200 p-4 overflow-y-auto space-y-4">
        <!-- Initial Greeting -->
        <div class="flex items-start space-x-2">
            <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex-shrink-0 flex items-center justify-center text-sm font-bold">AI</div>
            <div class="bg-slate-100 text-slate-800 rounded-2xl rounded-tl-none p-3.5 max-w-[80%] text-sm shadow-sm leading-relaxed">
                Hello! I am your English tutor. What would you like to practice today? You can ask me grammar questions, practice vocabulary, or type a sentence for me to correct.
            </div>
        </div>
    </div>

    <!-- Quick Action Chips -->
    <div class="bg-white border-x border-slate-200 px-4 py-2 flex gap-2 overflow-x-auto whitespace-nowrap">
        <button onclick="sendQuickPrompt('Can you check this sentence for grammar errors: ')" class="text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-full font-medium transition">Check My Grammar</button>
        <button onclick="sendQuickPrompt('Give me a new vocabulary word with an example sentence.')" class="text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-full font-medium transition">Learn Vocabulary</button>
        <button onclick="sendQuickPrompt('Let\'s practice reading comprehension. Give me a short paragraph and a question.')" class="text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-full font-medium transition">Reading Practice</button>
    </div>

    <!-- Input Form -->
    <div class="bg-white border border-slate-200 rounded-b-2xl p-3 shadow-sm">
        <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message here..." 
                required
                class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-center"
            >
                Send
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // REPLACE THIS URL with your actual deployed serverless endpoint URL (e.g., Vercel or Netlify function URL)
        const BACKEND_URL = 'https://your-serverless-deployment.vercel.app/api/chat';

        async function handleSendMessage(event) {
            event.preventDefault();
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            // Append User Message
            appendMessage(message, 'user');
            inputField.value = '';
            
            // Show typing indicator
            const loadingId = showLoadingIndicator();

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                removeLoadingIndicator(loadingId);

                if (response.ok) {
                    appendMessage(data.reply, 'ai');
                } else {
                    appendMessage('Sorry, I encountered an error connecting to the server: ' + (data.error || 'Unknown error'), 'ai');
                }
            } catch (error) {
                removeLoadingIndicator(loadingId);
                appendMessage('Network error. Please check your connection or backend URL configuration.', 'ai');
                console.error('Error:', error);
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById('chat-container');
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
