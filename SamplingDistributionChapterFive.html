<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 5 Sampling Distributions Quiz</title><style>body{font-family:Arial;max-width:1000px;margin:auto;padding:20px;background:#f4f7fb}h1{text-align:center;color:#1f4e79}.q{background:#fff;padding:15px;margin:12px 0;border-radius:8px}button{padding:12px 20px;font-size:18px}#results{display:none;background:#fff;padding:20px;margin-top:20px}</style></head><body><h1>Chapter 5 Sampling Distributions Quiz</h1><div id="quiz"></div><button onclick="gradeQuiz()">Submit Quiz</button><div id="results"></div><script>const questions=[{q:'1. Population mean 80, sd 20, n=25. Standard error?',o:['0.80','4.00','5.00','16.00'],a:'B'},{q:'2. Population mean 50 sd 12 n=36. Variance of X̄?',o:['2','4','12','24'],a:'B'},{q:'3. μ=100 σ=15 n=25. P(X̄>104)?',o:['0.0918','0.1821','0.4082','0.8179'],a:'A'},{q:'4. μ=70 σ=18 n=36. P(X̄<73)?',o:['0.8413','0.7580','0.6915','0.9332'],a:'A'},{q:'5. μ=40 σ=10 n=100. P(39<X̄<42)?',o:['0.8186','0.4772','0.3413','0.6827'],a:'A'},{q:'6. μ=120 σ=24 n=64. X̄ for z=1.50?',o:['121.5','122.5','124.5','126.0'],a:'C'},{q:'7. CLT: μ=200 σ=40 n=100 SE?',o:['2','4','10','20'],a:'B'},{q:'8. μ=75 σ=30 n=64. P(X̄>80)?',o:['0.0918','0.1821','0.5000','0.8179'],a:'A'},{q:'9. μ=500 σ=90 n=36. z for X̄=515?',o:['0.50','1.00','1.25','1.50'],a:'B'},{q:'10. μ=45 σ=12 n=144. P(X̄<46)?',o:['0.5000','0.6827','0.8413','0.9772'],a:'C'},{q:'11. E(X̄1-X̄2)?',o:['4','5','6','8'],a:'C'},{q:'12. Var(X̄1-X̄2)?',o:['4','6','8','12'],a:'C'},{q:'13. SD(X̄1-X̄2)?',o:['2.000','2.449','2.828','3.464'],a:'C'},{q:'14. P(X̄1-X̄2>3)?',o:['0.6915','0.7580','0.8413','0.9332'],a:'B'},{q:'15. P(X̄1-X̄2<2)?',o:['0.1587','0.1932','0.8068','0.8413'],a:'B'},{q:'16. E(p̂)?',o:['0.30','0.21','0.70','0.03'],a:'A'},{q:'17. Var(p̂)?',o:['0.0021','0.0210','0.2100','0.0300'],a:'A'},{q:'18. SE(p̂)?',o:['0.0210','0.0458','0.1450','0.2100'],a:'B'},{q:'19. P(p̂>0.50)?',o:['0.0206','0.0418','0.5000','0.9582'],a:'A'},{q:'20. P(p̂<0.55)?',o:['0.1060','0.1879','0.2500','0.8940'],a:'B'},{q:'21. E(p̂1-p̂2)?',o:['0.10','0.15','0.25','0.65'],a:'B'},{q:'22. Var(p̂1-p̂2)?',o:['0.003375','0.03375','0.3375','0.001688'],a:'A'},{q:'23. SE?',o:['0.0411','0.0581','0.1837','0.3375'],a:'B'},{q:'24. P(p̂1-p̂2>0.10)?',o:['0.5000','0.3413','0.1587','0.8413'],a:'A'},{q:'25. P(0.05<p̂1-2<0.15)?',o:['0.2586','0.5000','0.5172','0.7414'],a:'C'}];const L=['A','B','C','D'];let h='';questions.forEach((q,i)=>{h+=`<div class=q><h3>${q.q}</h3>`;q.o.forEach((x,j)=>{h+=`<label><input type=radio name=q${i} value=${L[j]}> ${L[j]}. ${x}</label><br>`});h+='</div>';});document.getElementById('quiz').innerHTML=h;function gradeQuiz(){let s=0;questions.forEach((q,i)=>{let c=document.querySelector('input[name=q'+i+']:checked');if(c&&c.value===q.a)s++;});let p=(s/questions.length*100).toFixed(1);document.getElementById('results').style.display='block';document.getElementById('results').innerHTML='<h2>Results</h2><p>Score: '+s+'/25</p><p>Percentage: '+p+'%</p><p>'+(p>=60?'PASS':'FAIL')+'</p>';}</script></body></html>
