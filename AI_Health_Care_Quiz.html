<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AI Health Care Quiz</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:20px} .q{margin:15px 0;padding:10px;border:1px solid #ccc} button{padding:10px 20px} #r{font-size:22px;font-weight:bold;margin-top:20px}</style></head><body><h1>Artificial Intelligence in Health Care Quiz</h1>

<form id="quiz"></form><button onclick="grade();return false;">Submit</button><div id="r"></div><script>const qs=[['What does AI stand for?',['Artificial Industry','Automated Information','Artificial Intelligence','Advanced Internet'],'C'],['In health care, AI helps computers perform tasks that usually require _____.',['Human intelligence','Physical strength','Animal instincts','Manual labor'],'A'],['Which is an AI task?',['Building roads','Flying airplanes','Growing crops','Analyzing medical data'],'D'],['AI applications increased because of:',['Smaller hospitals','Better roads','Increased computing power and large databases','More paper records'],'C'],['The idea of AI first appeared in the:',['Mid-twentieth century','Eighteenth century','Fifteenth century','Ancient world'],'A'],['Early AI systems were designed to:',['Replace nurses','Assist doctors in diagnosing diseases','Build hospitals','Sell medicine'],'B'],['Modern AI can analyze:',['Medical images','Ocean currents only','Sports scores only','Movie tickets'],'A'],['AI can help predict:',['Election results','Health risks','Weather forever','Lottery numbers'],'B'],['AI supports personalized:',['Housing plans','Travel packages','Treatment plans','Equipment sales'],'C'],['During COVID-19 AI helped study:',['Traffic patterns','The virus','Tourism trends','Sports injuries'],'B'],['AI improves efficiency and:',['Entertainment','Advertising','Accuracy','Construction'],'C'],['A concern related to AI is:',['Patient privacy','Shoe design','Farming methods','Road maintenance'],'A'],['Another issue is:',['Data security','Forest fires','Traffic congestion','Fuel prices'],'A'],['Experts warn about:',['Extra batteries','Algorithm bias','Too many doctors','New viruses'],'B'],['AI should _____ health professionals.',['Replace','Ignore','Assist','Control'],'C'],['Recommendations must be:',['Entertaining','Reliable','Expensive','Secret'],'B'],['AI is valuable for:',['Diagnosis, treatment, and research','Selling cars','Building bridges','Mining coal'],'A'],['Responsible AI is important for:',['Higher taxes','Larger buildings','More paperwork','Safe patient care'],'D'],['AI is increasingly used in:',['Hospitals and clinics','Only farms','Only factories','Only theaters'],'A'],['Main purpose of the essay:',['Promote sports','Explain AI role in health care','Describe travel destinations','Compare hospitals'],'B']];const form=document.getElementById('quiz');qs.forEach((q,i)=>{let h='<div class=q><p><b>'+(i+1)+'. '+q[0]+'</b></p>';['A','B','C','D'].forEach((l,j)=>{h+=`<label><input type=radio name=q${i} value=${l}> ${l}. ${q[1][j]}</label><br>`});h+='</div>';form.innerHTML+=h;});function grade(){let s=0;qs.forEach((q,i)=>{const a=document.querySelector('input[name=q'+i+']:checked');if(a&&a.value===q[2])s++;});document.getElementById('r').innerText='Score: '+s+'/20 ('+Math.round(s*100/20)+'%)';}</script></body></html>
